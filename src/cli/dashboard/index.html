<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDT v2 Local Control Center</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui/styles.css">
</head>
<body>

  <header>
    <h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      RDT v2 Control Center
    </h1>

    <!-- Interactive Task Run Console -->
    <div class="run-console-form">
      <input type="text" id="promptInput" placeholder="Describe code changes or bug fixes to run..." onkeydown="if(event.key==='Enter') runTask()" />
      <button id="runBtn" onclick="runTask()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Run Agent
      </button>
    </div>

    <div class="header-status-panel" style="display: flex; gap: 0.75rem; align-items: center;">
      <button id="themeToggleBtn" onclick="toggleTheme()" style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); border-radius: 9999px; color: var(--text-main); font-size: 0.8rem; padding: 0.4rem 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; transition: background 0.2s ease;">
        <span id="themeToggleIcon">☀️</span>
        <span id="themeToggleText">Light</span>
      </button>
      <div class="status-badge badge-idle" id="serverStatusBadge">
        <div class="pulse-dot"></div>
        <span id="serverStatusText">Idle</span>
      </div>
    </div>
  </header>

  <div class="app-container">
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <!-- Sidebar Task List -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Task History</span>
      </div>
      <div id="taskList" class="task-list"></div>
    </div>

    <!-- Main Content Panel -->
    <div class="main-content" id="mainPanel">
      <!-- Welcoming overview dashboard (default state) -->
    </div>
  </div>

  <script type="module" src="ui/app.js"></script>
</body>
</html>
