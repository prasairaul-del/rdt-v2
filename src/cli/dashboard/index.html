<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDT v2 Local Control Center</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #070913;
      --card-bg: rgba(13, 19, 32, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.35);
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.35);
      --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245, 158, 11, 0.35);
      --accent-red: #f43f5e;
      --accent-red-glow: rgba(244, 63, 94, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --sidebar-width: 320px;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-color: #f3f4f6;
    }

    body.light-theme {
      --bg-color: #f3f4f6;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.1);
      --accent-blue: #2563eb;
      --accent-blue-glow: rgba(37, 99, 235, 0.2);
      --accent-green: #059669;
      --accent-green-glow: rgba(5, 150, 105, 0.2);
      --accent-amber: #d97706;
      --accent-amber-glow: rgba(217, 119, 6, 0.2);
      --accent-red: #dc2626;
      --accent-red-glow: rgba(220, 38, 38, 0.2);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: rgba(0, 0, 0, 0.1);
      --text-color: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(8, 12, 22, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      gap: 2rem;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #60a5fa, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    /* Task Run Console Form */
    .run-console-form {
      flex: 1;
      max-width: 700px;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      transition: border-color 0.25s ease;
    }
    .run-console-form:focus-within {
      border-color: rgba(59, 130, 246, 0.5);
    }
    .run-console-form input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      padding: 0.5rem 1rem;
      outline: none;
    }
    .run-console-form input::placeholder {
      color: var(--text-muted);
    }
    .run-console-form button {
      background: var(--accent-blue);
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: all 0.25s ease;
    }
    .run-console-form button:hover {
      box-shadow: 0 0 12px var(--accent-blue-glow);
      transform: translateY(-1px);
    }
    .run-console-form button:disabled {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .header-status-panel {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Fix #14 — Cancel button */
    #cancelBtn {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--accent-red);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: none; /* shown only when a task is running */
    }
    #cancelBtn:hover { background: rgba(244, 63, 94, 0.25); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      text-transform: uppercase;
    }
    .badge-idle {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
    }
    .badge-busy {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--accent-amber);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .badge-idle .pulse-dot {
      background-color: var(--accent-green);
      box-shadow: 0 0 0 0 var(--accent-green-glow);
      animation: pulse-green 1.5s infinite;
    }
    .badge-busy .pulse-dot {
      background-color: var(--accent-amber);
      box-shadow: 0 0 0 0 var(--accent-amber-glow);
      animation: pulse-amber 1.5s infinite;
    }

    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    @keyframes pulse-amber {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    .app-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Background glows */
    .glow-bg {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(140px);
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 { top: -100px; right: -100px; background-color: rgba(59, 130, 246, 0.12); }
    .glow-2 { bottom: -100px; left: -100px; background-color: rgba(16, 185, 129, 0.08); }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      border-right: 1px solid var(--card-border);
      background: rgba(8, 12, 22, 0.5);
      display: flex;
      flex-direction: column;
      z-index: 2;
    }

    .sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--card-border);
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .task-item:hover {
      border-color: rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
      background: rgba(13, 18, 30, 0.9);
    }
    .task-item.active {
      border-color: var(--accent-blue);
      box-shadow: 0 0 16px var(--accent-blue-glow);
      background: rgba(13, 18, 30, 0.95);
    }

    .task-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .task-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .task-status {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.125rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .status-running { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    .status-success { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-failed { background: rgba(244, 63, 94, 0.15); color: var(--accent-red); border: 1px solid rgba(244, 63, 94, 0.3); }
    .status-created { background: rgba(156, 163, 175, 0.15); color: var(--text-muted); border: 1px solid rgba(156, 163, 175, 0.3); }
    .status-queued { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-cancelled { background: rgba(156, 163, 175, 0.15); color: var(--text-muted); border: 1px solid rgba(156, 163, 175, 0.3); }

    .task-desc {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      display: block;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Welcome / Config overview page styling */
    .welcome-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .welcome-header {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .welcome-header svg {
      width: 48px;
      height: 48px;
      stroke: var(--accent-green);
    }
    .welcome-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .config-section-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .file-explorer-card {
      max-height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.3);
      border: 1px solid var(--card-border);
      padding: 1rem;
      border-radius: 12px;
    }

    .file-explorer-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .file-explorer-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .file-explorer-item input {
      accent-color: var(--accent-blue);
      cursor: pointer;
    }
    .file-explorer-item label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      flex: 1;
    }

    /* Task Detail panel layouts */
    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
    }

    .task-main-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
    }

    .task-info-block h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    /* Visual Pipeline Flowchart */
    .pipeline-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0.5rem;
      overflow-x: auto;
      position: relative;
    }

    .pipeline-connector {
      flex: 1;
      height: 2px;
      background: var(--card-border);
      margin: 0 -8px;
      z-index: 1;
    }
    .pipeline-connector.active {
      background: linear-gradient(90deg, var(--accent-blue), var(--card-border));
    }
    .pipeline-connector.passed {
      background: var(--accent-green);
    }

    .pipeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 2;
      position: relative;
      min-width: 90px;
    }

    .pipeline-bubble {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid var(--card-border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.3s ease;
    }

    .pipeline-step.active .pipeline-bubble {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px var(--accent-blue-glow);
      background: var(--accent-blue);
      color: #fff;
    }
    
    .pipeline-step.passed .pipeline-bubble {
      border-color: var(--accent-green);
      background: var(--accent-green);
      color: #fff;
    }

    .pipeline-step.failed .pipeline-bubble {
      border-color: var(--accent-red);
      background: var(--accent-red);
      color: #fff;
    }

    .pipeline-step-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
    }
    .pipeline-step.active .pipeline-step-label {
      color: var(--accent-blue);
      font-weight: 600;
    }
    .pipeline-step.passed .pipeline-step-label {
      color: var(--accent-green);
    }

    /* Guide Details Panel */
    .step-guide-panel {
      background: rgba(59, 130, 246, 0.03);
      border: 1px solid rgba(59, 130, 246, 0.15);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .step-guide-icon {
      width: 24px;
      height: 24px;
      stroke: var(--accent-blue);
      flex-shrink: 0;
    }
    .step-guide-content h4 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.15rem;
      color: var(--accent-blue);
    }
    .step-guide-content p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .token-meter-container {
      margin-top: 0.5rem;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
      overflow: hidden;
    }
    .token-meter-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
      border-radius: 9999px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Tabs & Details */
    .tabs-container {
      display: flex;
      border-bottom: 1px solid var(--card-border);
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .tab-button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
      padding: 0.5rem 0;
      cursor: pointer;
      position: relative;
      transition: color 0.25s ease;
    }
    .tab-button:hover { color: var(--text-main); }
    .tab-button.active { color: var(--accent-blue); font-weight: 600; }
    .tab-button.active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background-color: var(--accent-blue);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Collapsible diff explorer cards */
    .file-diff-card {
      border: 1px solid var(--card-border);
      background: #090d16;
      border-radius: 12px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .file-diff-header {
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .file-diff-header:hover {
      background: rgba(15, 23, 42, 0.95);
    }
    
    .file-diff-stats {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .file-diff-body {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      padding: 1rem;
      overflow-x: auto;
      white-space: pre;
    }

    .diff-line {
      display: flex;
      padding: 0.1rem 0.5rem;
      margin: 0 -0.5rem;
    }
    .diff-line-num {
      width: 40px;
      color: rgba(255, 255, 255, 0.2);
      user-select: none;
      text-align: right;
      padding-right: 1rem;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      margin-right: 1rem;
    }
    .diff-added { background: rgba(16, 185, 129, 0.08); color: #34d399; }
    .diff-removed { background: rgba(244, 63, 94, 0.08); color: #fb7185; }
    .diff-meta { color: #818cf8; font-weight: 500; background: rgba(129, 140, 248, 0.05); }

    /* Plan step styling */
    .plan-step-item {
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.3);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .plan-step-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .plan-step-id {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--accent-blue);
    }

    .plan-step-risk { font-weight: 600; text-transform: uppercase; }
    .risk-low { color: var(--accent-green); }
    .risk-medium { color: var(--accent-amber); }
    .risk-high { color: var(--accent-red); }

    /* File tag lists */
    .file-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
    
    .file-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 0.125rem 0.5rem;
      border-radius: 4px;
      color: var(--text-main);
    }

    /* Provider list */
    .provider-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .provider-card {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .provider-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .provider-name { font-weight: 600; font-size: 1.05rem; }
    .provider-model-desc { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-muted); }

    /* Logs view */
    .checks-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .check-item {
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: rgba(9, 13, 22, 0.6);
      overflow: hidden;
    }

    .check-header {
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid var(--card-border);
    }

    .check-command { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 500; }

    .check-output {
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      color: var(--text-muted);
      max-height: 200px;
      overflow-y: auto;
      background: #05080f;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      RDT v2 Control Center
    </h1>

    <!-- Interactive Task Run Console -->
    <div class="run-console-form">
      <input type="text" id="promptInput" placeholder="Describe code changes or bug fixes to run..." onkeydown="if(event.key==='Enter') runTask()" />
      <button id="runBtn" onclick="runTask()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Run Agent
      </button>
    </div>

    <div class="header-status-panel" style="display: flex; gap: 0.75rem; align-items: center;">
      <button id="themeToggleBtn" onclick="toggleTheme()" style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); border-radius: 9999px; color: var(--text-main); font-size: 0.8rem; padding: 0.4rem 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; transition: background 0.2s ease;">
        <span id="themeToggleIcon">☀️</span>
        <span id="themeToggleText">Light</span>
      </button>
      <div class="status-badge badge-idle" id="serverStatusBadge">
        <div class="pulse-dot"></div>
        <span id="serverStatusText">Idle</span>
      </div>
    </div>
  </header>

  <div class="app-container">
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <!-- Sidebar Task List -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Task History</span>
      </div>
      <div id="taskList" class="task-list"></div>
    </div>

    <!-- Main Content Panel -->
    <div class="main-content" id="mainPanel">
      <!-- Welcoming overview dashboard (default state) -->
    </div>
  </div>

  <script>
    let tasks = [];
    let selectedTaskId = null;
    let config = null;
    let files = [];
    let selectedFilesOverride = new Set();
    let isServerRunningTask = false;

    // Plain English Descriptions of state machine steps
    const stepGuides = {
      'created': {
        title: 'Task Created',
        desc: 'The task has been registered and is queueing to start.'
      },
      'capturing_baseline': {
        title: 'Capturing Baseline',
        desc: 'Taking a backup of your workspace files and recording git status so we can safely undo changes if needed.'
      },
      'loading_context': {
        title: 'Loading Context',
        desc: 'Loading project language settings, customized instructions, and active provider configurations.'
      },
      'scanning_repo': {
        title: 'Scanning Repository',
        desc: 'Scanning directory structures and building/updating the local vector search database cache.'
      },
      'selecting_files': {
        title: 'Selecting Files',
        desc: 'Analyzing your prompt request and searching the codebase to pick the most relevant file targets.'
      },
      'planning': {
        title: 'Creating Plan',
        desc: 'Sifting through selected file contents to formulate a step-by-step code implementation recipe.'
      },
      'editing': {
        title: 'Writing Edits',
        desc: 'Generating and applying surgical code replacements directly to target files.'
      },
      'reviewing': {
        title: 'Reviewing & Testing',
        desc: 'Compiling edits, running typechecks, and running automated test suites to audit code correctness.'
      },
      'fixing': {
        title: 'Correcting Edits',
        desc: 'Feeding test and compilation errors back into prompt contexts for surgical correction.'
      },
      'finalizing': {
        title: 'Finalizing Changes',
        desc: 'Saving final surgical patches and logging execution results.'
      },
      'done': {
        title: 'Done',
        desc: 'Task completed successfully! All checks and test suites passed.'
      },
      'failed': {
        title: 'Failed',
        desc: 'The execution encountered a fatal error.'
      },
      'rolling_back': {
        title: 'Rolling Back',
        desc: 'Review failed. Restoring modified workspace files to the pristine baseline snapshot.'
      },
      'failed_clean': {
        title: 'Failed (Clean Rollback)',
        desc: 'Task failed, but files were successfully rolled back to their baseline states.'
      },
      'failed_dirty': {
        title: 'Failed (Dirty Workspace)',
        desc: 'Task failed. Rollback could not complete or baseline was missing. Manual git check recommended.'
      }
    };

    // Load configuration
    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          config = await res.json();
        }
      } catch (err) {
        console.error('Failed to load configuration:', err);
      }
    }

    // Load recent tasks
    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks');
        if (res.ok) {
          tasks = await res.json();
          renderTaskList();
        }
      } catch (err) {
        console.error('Failed to fetch tasks:', err);
      }
    }

    // Load project files
    async function loadFiles() {
      try {
        const res = await fetch('/api/files');
        if (res.ok) {
          files = await res.json();
        }
      } catch (err) {
        console.error('Failed to fetch project files:', err);
      }
    }

    // Fetch server status lock
    async function checkServerStatus() {
      try {
        const res = await fetch('/api/status');
        if (res.ok) {
          const status = await res.json();
          updateServerStatusBadge(status.running, status.queueCount || 0);
        }
      } catch (err) {
        console.error('Failed to check server status:', err);
      }
    }

    function updateServerStatusBadge(running, queueCount) {
      isServerRunningTask = running;
      const badge = document.getElementById('serverStatusBadge');
      const text = document.getElementById('serverStatusText');
      const btn = document.getElementById('runBtn');

      if (running) {
        badge.className = 'status-badge badge-busy';
        text.innerText = queueCount > 0 ? `Running (Queue: ${queueCount})` : 'Running Task';
      } else {
        if (queueCount > 0) {
          badge.className = 'status-badge badge-busy';
          text.innerText = `Queued (${queueCount})`;
        } else {
          badge.className = 'status-badge badge-idle';
          text.innerText = 'Idle';
        }
      }
      // Keep run button enabled to support queueing!
      btn.disabled = false;
    }

    // Trigger task run in background
    async function runTask() {
      const input = document.getElementById('promptInput');
      const prompt = input.value.trim();
      if (!prompt) return;

      if (isServerRunningTask) {
        alert('A task is already running in this workspace.');
        return;
      }

      // Convert selected file overrides if any into context text
      let finalPrompt = prompt;
      if (selectedFilesOverride.size > 0) {
        const filesContext = Array.from(selectedFilesOverride).join(', ');
        finalPrompt += `\n(Focus files: ${filesContext})`;
      }

      updateServerStatusBadge(true);
      input.value = '';

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ request: finalPrompt })
        });
        
        if (!res.ok) {
          const err = await res.json();
          alert('Failed to start task: ' + (err.error || 'Unknown error'));
          updateServerStatusBadge(false);
        } else {
          // Clear file checklist highlights
          selectedFilesOverride.clear();
          const checkboxes = document.querySelectorAll('.file-explorer-item input');
          checkboxes.forEach(c => c.checked = false);
        }
      } catch (err) {
        console.error(err);
        alert('Failed to connect to server');
        updateServerStatusBadge(false);
      }
    }

    // Render task items in sidebar
    function renderTaskList() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 2rem 0;">No tasks logged</div>`;
        return;
      }

      tasks.forEach((task, idx) => {
        const item = document.createElement('div');
        item.className = `task-item ${task.id === selectedTaskId ? 'active' : ''}`;
        item.onclick = () => selectTask(task.id);

        const timeStr = new Date(task.startedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const requestEscaped = escapeHtml(task.request || 'Empty task request');
        const taskNum = tasks.length - idx;
        const shortId = task.id.replace('task_', '').substring(0, 8);

        let durationStr = '';
        if (task.finishedAt) {
          const diffMs = new Date(task.finishedAt) - new Date(task.startedAt);
          const secs = Math.floor(diffMs / 1000);
          if (secs < 60) {
            durationStr = `${secs}s`;
          } else {
            const mins = Math.floor(secs / 60);
            const remainingSecs = secs % 60;
            durationStr = `${mins}m ${remainingSecs}s`;
          }
        } else if (task.status === 'running') {
          const diffMs = new Date() - new Date(task.startedAt);
          const secs = Math.floor(diffMs / 1000);
          if (secs < 60) {
            durationStr = `${secs}s elapsed`;
          } else {
            const mins = Math.floor(secs / 60);
            durationStr = `${mins}m elapsed`;
          }
        }

        item.innerHTML = `
          <div class="task-item-header">
            <span class="task-id">#${taskNum} (${shortId})</span>
            <span class="task-status status-${task.status}">${task.status}</span>
          </div>
          <div class="task-desc" title="${requestEscaped}">${requestEscaped}</div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.25rem;">
            <span class="task-time">${timeStr}</span>
            ${durationStr ? `<span class="task-duration" style="font-size: 0.75rem; color: var(--text-muted);">${durationStr}</span>` : ''}
          </div>
        `;
        container.appendChild(item);
      });
    }

    // Select and load details for a task
    async function selectTask(taskId) {
      selectedTaskId = taskId;
      renderTaskList(); // Update active highlights in sidebar
      
      const panel = document.getElementById('mainPanel');
      panel.innerHTML = `<div class="empty-state"><div class="pulse-dot" style="width: 24px; height: 24px; background-color: var(--accent-blue);"></div><p>Loading task details...</p></div>`;

      try {
        const res = await fetch(`/api/tasks/${taskId}`);
        if (res.ok) {
          const task = await res.json();
          renderTaskDetails(task);
          loadPastLogs(task.id);
        } else {
          panel.innerHTML = `<div class="empty-state"><p style="color: var(--accent-red)">Error loading task details</p></div>`;
        }
      } catch (err) {
        console.error(err);
        panel.innerHTML = `<div class="empty-state"><p style="color: var(--accent-red)">Failed to connect to server</p></div>`;
      }
    }

    // Render selected task details panels
    function renderTaskDetails(task) {
      const panel = document.getElementById('mainPanel');
      panel.innerHTML = '';

      // Main Header Card
      const headerCard = document.createElement('div');
      headerCard.className = 'panel-card';
      
      const requestText = escapeHtml(task.request || 'Empty task request');
      const errorSection = task.errorMessage 
        ? `<div style="background: rgba(244, 63, 94, 0.1); border-left: 4px solid var(--accent-red); padding: 1rem; border-radius: 8px; margin-top: 1rem; font-size: 0.95rem;">
             <strong style="color: var(--accent-red)">Execution Error:</strong> ${escapeHtml(task.errorMessage)}
           </div>`
        : '';

      headerCard.innerHTML = `
        <div class="task-main-header" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
          <div class="task-info-block" style="flex: 1;">
            <h2>${requestText}</h2>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
              <span class="task-id">ID: ${task.id}</span>
              <span class="task-status status-${task.status}">${task.status}</span>
              <span style="font-size: 0.85rem; color: var(--text-muted);">Started: ${new Date(task.startedAt).toLocaleString()}</span>
            </div>
          </div>
          ${task.status === 'running' ? `
            <button id="cancelTaskBtn" onclick="cancelCurrentTask()" style="background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: var(--accent-red); padding: 0.5rem 1.2rem; border-radius: 9999px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;">
              Cancel Task
            </button>
          ` : ''}
        </div>
        ${errorSection}
      `;
      panel.appendChild(headerCard);

      // Pipeline State Flowchart Card
      const pipelineCard = document.createElement('div');
      pipelineCard.className = 'panel-card';
      
      // Determine description for active state
      const guide = stepGuides[task.status] || { title: 'Running Stage', desc: 'The AI Agent is working on this pipeline stage.' };

      pipelineCard.innerHTML = `
        <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-muted)">State Machine Pipeline</h3>
        <div class="pipeline-container">
          ${renderPipelineSteps(task.status)}
        </div>
        <div class="step-guide-panel">
          <svg class="step-guide-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <div class="step-guide-content">
            <h4>Active: ${escapeHtml(guide.title)}</h4>
            <p>${escapeHtml(guide.desc)}</p>
          </div>
        </div>
      `;
      panel.appendChild(pipelineCard);

      // Token and File Stats Card
      const statsCard = document.createElement('div');
      statsCard.className = 'stats-grid';
      
      const totalTokens = task.usage?.total_tokens ?? 0;
      const promptTokens = task.usage?.prompt_tokens ?? 0;
      const completionTokens = task.usage?.completion_tokens ?? 0;
      const tokenPercent = Math.min(100, Math.round((totalTokens / 32000) * 100));

      // Calculate Dollar Cost Estimator:
      // Free models are 0.00. Average standard models cost around $0.15/1M input and $0.60/1M output tokens.
      let costStr = 'Free Tier';
      if (totalTokens > 0) {
        // Find if they are using groq/paid models or free
        const isFree = task.providersUsed?.some(p => p.toLowerCase().includes('free')) ?? true;
        if (!isFree) {
          const costCents = ((promptTokens * 0.15) + (completionTokens * 0.60)) / 10000;
          costStr = costCents < 0.01 ? '< $0.01' : `$${costCents.toFixed(3)}`;
        }
      }

      const filesSelected = task.selectedFiles?.length ?? 0;
      const filesChanged = task.changedFiles?.length ?? 0;

      statsCard.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Estimated Cost</div>
          <div class="stat-val" style="color: var(--accent-green)">${costStr}</div>
          <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">
            Prompt: ${promptTokens.toLocaleString()} | Comp: ${completionTokens.toLocaleString()}
          </div>
          <div class="token-meter-container">
            <div class="token-meter-fill" style="width: ${tokenPercent}%"></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Files Context</div>
          <div class="stat-val">${filesSelected}</div>
          <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Target files scanned</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Files Modified</div>
          <div class="stat-val">${filesChanged}</div>
          <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Surgically edited files</div>
        </div>
      `;
      panel.appendChild(statsCard);

      // Tabs Grid Card
      const tabsCard = document.createElement('div');
      tabsCard.className = 'panel-card';
      
      tabsCard.innerHTML = `
        <div class="tabs-container">
          <button class="tab-button active" onclick="switchTab('tab-plan')">Plan & Context</button>
          <button class="tab-button" onclick="switchTab('tab-diff')">Surgical Diff</button>
          <button class="tab-button" onclick="switchTab('tab-checks')">Checks & Test Logs</button>
          <button class="tab-button" onclick="switchTab('tab-providers')">Provider Health</button>
          <button class="tab-button" onclick="switchTab('tab-logs')">Live Logs</button>
        </div>

        <!-- Plan Tab -->
        <div class="tab-content active" id="tab-plan">
          <div style="margin-bottom: 1rem;">
            <strong style="display: block; margin-bottom: 0.5rem;">Plan Steps Summary:</strong>
            <p style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.4;">${escapeHtml(task.planSummary || 'No plan summary available')}</p>
          </div>
          <div>
            <strong style="display: block; margin-bottom: 0.5rem;">Selected Files Context:</strong>
            <div class="file-tag-list">
              ${task.selectedFiles && task.selectedFiles.length > 0
                ? task.selectedFiles.map(f => `<span class="file-tag">${escapeHtml(f)}</span>`).join('')
                : '<span style="font-size: 0.9rem; color: var(--text-muted);">No files selected</span>'}
            </div>
          </div>
        </div>

        <!-- Diff Tab -->
        <div class="tab-content" id="tab-diff">
          ${renderDiffTab(task)}
        </div>

        <!-- Checks Tab -->
        <div class="tab-content" id="tab-checks">
          ${renderChecksTab(task)}
        </div>

        <!-- Providers Tab -->
        <div class="tab-content" id="tab-providers">
          ${renderProvidersTab(task)}
        </div>

        <!-- Logs Tab -->
        <div class="tab-content" id="tab-logs">
          <div class="logs-console" id="logsConsole" style="background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); border-radius: var(--border-radius); font-family: monospace; font-size: 0.85rem; padding: 1rem; height: 320px; overflow-y: auto; color: var(--text-color); white-space: pre-wrap;"></div>
        </div>
      `;
      panel.appendChild(tabsCard);
    }

    // Render pipeline status bubbles
    function renderPipelineSteps(status) {
      const steps = [
        { key: 'capturing_baseline', label: 'Baseline' },
        { key: 'loading_context', label: 'Context' },
        { key: 'scanning_repo', label: 'Scan' },
        { key: 'selecting_files', label: 'Files' },
        { key: 'planning', label: 'Plan' },
        { key: 'editing', label: 'Edit' },
        { key: 'reviewing', label: 'Review' },
        { key: 'finalizing', label: 'Finalize' }
      ];

      let activeIndex = -1;
      let isFailed = false;

      if (status === 'done') {
        activeIndex = steps.length;
      } else if (status.startsWith('failed')) {
        isFailed = true;
        activeIndex = steps.length - 1; 
      } else {
        activeIndex = steps.findIndex(s => s.key === status);
      }

      let html = '';
      steps.forEach((step, i) => {
        let stepClass = '';
        let bubbleContent = i + 1;

        if (i < activeIndex) {
          stepClass = 'passed';
          bubbleContent = '✓';
        } else if (i === activeIndex) {
          if (isFailed) {
            stepClass = 'failed';
            bubbleContent = '✗';
          } else {
            stepClass = 'active';
          }
        }

        html += `
          <div class="pipeline-step ${stepClass}">
            <div class="pipeline-bubble">${bubbleContent}</div>
            <div class="pipeline-step-label">${step.label}</div>
          </div>
        `;
        if (i < steps.length - 1) {
          const connClass = i < activeIndex ? 'passed' : i === activeIndex ? 'active' : '';
          html += `<div class="pipeline-connector ${connClass}"></div>`;
        }
      });

      return html;
    }

    // Render surgical diffs
    function renderDiffTab(task) {
      if (!task.changedFiles || task.changedFiles.length === 0) {
        return `<div style="text-align: center; color: var(--text-muted); padding: 2rem;">No code edits were applied.</div>`;
      }

      let filesList = `<div style="margin-bottom: 1rem;"><strong>Modified Files:</strong><div class="file-tag-list">`;
      task.changedFiles.forEach(f => {
        filesList += `<span class="file-tag" style="border-color: var(--accent-green)">${escapeHtml(f)}</span>`;
      });
      filesList += `</div></div>`;

      let diffContent = '';
      if (!task.diff) {
        diffContent = `
          <div style="text-align: center; color: var(--text-muted); border: 1px dashed var(--card-border); padding: 2rem; border-radius: 12px;">
            No raw diff patch saved in database records. Changes successfully applied to workspace.
          </div>
        `;
      } else {
        // Parse diff file-by-file
        diffContent = parseAndRenderDiff(task.diff);
      }

      return filesList + diffContent;
    }

    // Parse diff and render collapsible cards per file
    function parseAndRenderDiff(diffText) {
      const fileDiffs = [];
      let currentFile = null;
      let currentLines = [];

      const lines = diffText.split('\n');
      lines.forEach(line => {
        if (line.startsWith('diff --git ')) {
          if (currentFile) {
            fileDiffs.push({ file: currentFile, lines: currentLines });
          }
          // Extract filename from "diff --git a/path b/path"
          const match = line.match(/b\/(.+)$/);
          currentFile = match ? match[1] : 'Unknown file';
          currentLines = [];
        } else if (currentFile) {
          currentLines.push(line);
        }
      });
      if (currentFile) {
        fileDiffs.push({ file: currentFile, lines: currentLines });
      }

      let html = '';
      fileDiffs.forEach((fd, index) => {
        // Calculate add/remove counts
        const added = fd.lines.filter(l => l.startsWith('+') && !l.startsWith('+++')).length;
        const removed = fd.lines.filter(l => l.startsWith('-') && !l.startsWith('---')).length;

        // Render lines with line numbers
        let lineIdx = 0;
        let diffBodyText = fd.lines.map(line => {
          let lineClass = '';
          if (line.startsWith('+') && !line.startsWith('+++')) {
            lineClass = 'diff-added';
          } else if (line.startsWith('-') && !line.startsWith('---')) {
            lineClass = 'diff-removed';
          } else if (line.startsWith('@@') || line.startsWith('index ')) {
            lineClass = 'diff-meta';
          }
          
          lineIdx++;
          return `
            <div class="diff-line ${lineClass}">
              <div class="diff-line-num">${lineIdx}</div>
              <span>${escapeHtml(line)}</span>
            </div>
          `;
        }).join('');

        html += `
          <div class="file-diff-card">
            <div class="file-diff-header" onclick="toggleDiffBody('diff-card-body-${index}')">
              <span>${escapeHtml(fd.file)}</span>
              <span class="file-diff-stats">
                <span style="color: var(--accent-green)">+${added}</span>
                <span style="color: var(--accent-red)">-${removed}</span>
              </span>
            </div>
            <div class="file-diff-body" id="diff-card-body-${index}">
              ${diffBodyText}
            </div>
          </div>
        `;
      });

      return html;
    }

    function toggleDiffBody(id) {
      const body = document.getElementById(id);
      if (body) {
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
      }
    }

    // Render test logs tab
    function renderChecksTab(task) {
      if (!task.testsRun || task.testsRun.length === 0) {
        return `<div style="text-align: center; color: var(--text-muted); padding: 2rem;">No check runs or tests recorded for this task.</div>`;
      }

      let html = `<div class="checks-list">`;
      task.testsRun.forEach(check => {
        let checkObj = { command: 'Test runner', passed: true, outputSummary: 'Passed successfully' };
        if (typeof check === 'string') {
          try {
            checkObj = JSON.parse(check);
          } catch {
            checkObj = { command: 'Test check', passed: !check.toLowerCase().includes('fail'), outputSummary: check };
          }
        } else {
          checkObj = check;
        }

        const statusLabel = checkObj.passed ? 'PASSED' : 'FAILED';
        const statusClass = checkObj.passed ? 'status-success' : 'status-failed';

        html += `
          <div class="check-item">
            <div class="check-header">
              <span class="check-command">${escapeHtml(checkObj.command)}</span>
              <span class="task-status ${statusClass}">${statusLabel}</span>
            </div>
            <div class="check-output">${escapeHtml(checkObj.outputSummary || 'No output summary provided')}</div>
          </div>
        `;
      });
      html += `</div>`;
      return html;
    }

    // Render provider status tab
    function renderProvidersTab(task) {
      if (!task.providersUsed || task.providersUsed.length === 0) {
        return `<div style="text-align: center; color: var(--text-muted); padding: 2rem;">No provider logs for this task.</div>`;
      }

      let html = `<div class="provider-grid">`;
      task.providersUsed.forEach(p => {
        const [provId, modelId] = p.split('/');
        html += `
          <div class="provider-card">
            <div class="provider-title-row">
              <span class="provider-name">${escapeHtml(provId || 'Provider')}</span>
              <span class="task-status status-success" style="font-size: 0.65rem;">Active</span>
            </div>
            <span class="provider-model-desc">Model: ${escapeHtml(modelId || 'default')}</span>
          </div>
        `;
      });
      html += `</div>`;
      return html;
    }

    // Switch active detail tabs
    function switchTab(tabId) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      const btn = Array.from(document.querySelectorAll('.tab-button')).find(b => b.getAttribute('onclick').includes(tabId));
      if (btn) btn.classList.add('active');

      const content = document.getElementById(tabId);
      if (content) content.classList.add('active');
    }

    // Toggle context file select checklist
    function toggleFileSelect(filePath) {
      if (selectedFilesOverride.has(filePath)) {
        selectedFilesOverride.delete(filePath);
      } else {
        selectedFilesOverride.add(filePath);
      }
      console.log('Selected context files:', selectedFilesOverride);
    }

    // Render welcome / workspace status panel
    function renderWelcomePanel() {
      const panel = document.getElementById('mainPanel');
      panel.innerHTML = '';

      const welcomeDiv = document.createElement('div');
      welcomeDiv.className = 'welcome-container';

      // Load config summaries
      const projName = config?.project?.name || 'Workspace';
      const projLang = config?.project?.language || 'typescript';
      const projPkg = config?.project?.package_manager || 'bun';
      const testCmd = config?.project?.test_command || 'bun test';

      // Render live provider list
      let providersHTML = '';
      if (providersHealth && providersHealth.length > 0) {
        providersHTML = `<div class="provider-grid">`;
        providersHealth.forEach(p => {
          let statusClass = 'status-success';
          let statusText = 'Healthy';
          if (p.status === 'cooldown') {
            statusClass = 'status-fixing';
            statusText = `Cooldown`;
          } else if (p.status === 'degraded') {
            statusClass = 'status-failed';
            statusText = 'Degraded';
          }
          const cooldownTag = p.cooldownUntil && new Date(p.cooldownUntil) > new Date()
            ? `<div style="font-size: 0.7rem; color: var(--accent-red); margin-top: 0.25rem;">Cooldown until: ${new Date(p.cooldownUntil).toLocaleTimeString()}</div>`
            : '';
          const statsTag = `<div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem;">Requests: ${p.requestsThisMinute}/min, ${p.requestsToday}/day</div>`;
          providersHTML += `
            <div class="provider-card">
              <div class="provider-title-row">
                <span class="provider-name">${escapeHtml(p.providerId)}</span>
                <span class="task-status ${statusClass}" style="font-size: 0.65rem;">${statusText}</span>
              </div>
              <span class="provider-model-desc">Model: ${escapeHtml(p.modelId)}</span>
              <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Quality: ${p.quality} | Cost: ${p.cost}</span>
              ${cooldownTag}
              ${statsTag}
            </div>
          `;
        });
        providersHTML += `</div>`;
      } else if (config?.providers && config.providers.length > 0) {
        // Fallback to config provider display if health endpoint isn't fully loaded yet
        providersHTML = `<div class="provider-grid">`;
        config.providers.forEach(p => {
          if (!p.enabled) return;
          const modelsText = p.models.map(m => m.id).join(', ') || 'Default';
          providersHTML += `
            <div class="provider-card">
              <div class="provider-title-row">
                <span class="provider-name">${escapeHtml(p.id)}</span>
                <span class="task-status status-success" style="font-size: 0.65rem;">Online</span>
              </div>
              <span class="provider-model-desc">Endpoint: ${escapeHtml(p.base_url)}</span>
              <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Models: ${escapeHtml(modelsText)}</span>
            </div>
          `;
        });
        providersHTML += `</div>`;
      } else {
        providersHTML = `<p style="font-size: 0.9rem; color: var(--text-muted);">No provider configurations found.</p>`;
      }

      // Render workspace files checklist
      let filesHTML = '';
      if (files && files.length > 0) {
        filesHTML = `
          <input type="text" id="fileFilterInput" placeholder="Search & filter files..." oninput="filterFiles()" style="background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); color: var(--text-color); border-radius: var(--border-radius); padding: 0.45rem 0.85rem; width: 100%; box-sizing: border-box; margin-bottom: 0.75rem; font-size: 0.85rem;" />
          <div class="file-explorer-card" style="max-height: 250px; overflow-y: auto;">
        `;
        files.forEach(f => {
          const isSelected = selectedFilesOverride.has(f);
          filesHTML += `
            <div class="file-explorer-item">
              <input type="checkbox" id="file-check-${escapeHtml(f)}" ${isSelected ? 'checked' : ''} onchange="toggleFileSelect('${escapeHtml(f)}')">
              <label for="file-check-${escapeHtml(f)}">${escapeHtml(f)}</label>
            </div>
          `;
        });
        filesHTML += `</div>`;
      } else {
        filesHTML = `<p style="font-size: 0.9rem; color: var(--text-muted);">No files found in workspace.</p>`;
      }

      welcomeDiv.innerHTML = `
        <div class="welcome-header">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
          <div>
            <h2>Workspace Status: ${escapeHtml(projName)}</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Project type: ${escapeHtml(projLang)} | Package Manager: ${escapeHtml(projPkg)} | Test Command: ${escapeHtml(testCmd)}</p>
          </div>
        </div>

        <div class="config-grid">
          <div>
            <div class="config-section-title">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
              Active LLM Providers
            </div>
            ${providersHTML}
          </div>

          <div>
            <div class="config-section-title">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
              Workspace Context Override
            </div>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">Pre-select files to force-include in the AI agent's prompt context:</p>
            ${filesHTML}
          </div>
        </div>
      `;

      panel.appendChild(welcomeDiv);
    }

    // Escape HTML utilities
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    let providersHealth = [];

    async function loadProvidersHealth() {
      try {
        const res = await fetch('/api/providers');
        if (res.ok) {
          providersHealth = await res.json();
        }
      } catch (err) {
        console.error('Failed to load provider health:', err);
      }
    }

    function filterFiles() {
      const query = document.getElementById('fileFilterInput').value.toLowerCase();
      const items = document.querySelectorAll('.file-explorer-item');
      items.forEach(item => {
        const label = item.querySelector('label').innerText.toLowerCase();
        if (label.includes(query)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function stripAnsi(text) {
      if (!text) return '';
      return text.replace(/[\u001b\u009b][[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g, '');
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      updateThemeUI(isLight);
    }

    function updateThemeUI(isLight) {
      const icon = document.getElementById('themeToggleIcon');
      const text = document.getElementById('themeToggleText');
      if (icon) icon.innerText = isLight ? '🌙' : '☀️';
      if (text) text.innerText = isLight ? 'Dark' : 'Light';
    }

    async function loadPastLogs(taskId) {
      const consoleDiv = document.getElementById('logsConsole');
      if (!consoleDiv) return;
      consoleDiv.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem;">Loading logs...</div>';
      try {
        const res = await fetch(`/api/tasks/${taskId}/logs`);
        if (res.ok) {
          const text = await res.text();
          consoleDiv.innerHTML = '';
          const lines = text.split('\n');
          lines.forEach(line => {
            if (!line.trim()) return;
            const cleanLine = stripAnsi(line);
            const logLine = document.createElement('div');
            if (cleanLine.includes('ERROR')) {
              logLine.style.color = '#ff6b6b';
            } else if (cleanLine.includes('WARN')) {
              logLine.style.color = '#ffd25c';
            } else if (cleanLine.includes('INFO')) {
              logLine.style.color = '#4dadf7';
            } else if (cleanLine.includes('DEBUG')) {
              logLine.style.color = '#adb5bd';
            } else {
              logLine.style.color = 'var(--text-main)';
            }
            logLine.innerText = cleanLine;
            consoleDiv.appendChild(logLine);
          });
          consoleDiv.scrollTop = consoleDiv.scrollHeight;
        } else {
          consoleDiv.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem;">No log file found or task is still starting.</div>';
        }
      } catch (err) {
        consoleDiv.innerHTML = '<div style="color: var(--accent-red); font-size: 0.85rem;">Failed to load logs from server.</div>';
      }
    }

    async function cancelCurrentTask() {
      if (!confirm('Are you sure you want to cancel the running task?')) return;
      try {
        const res = await fetch('/api/tasks/current', { method: 'DELETE' });
        if (res.ok) {
          alert('Cancellation requested.');
          checkServerStatus();
          loadTasks();
        } else {
          const body = await res.json();
          alert('Failed to cancel task: ' + (body.error || 'unknown error'));
        }
      } catch (err) {
        alert('Error communicating with server: ' + err);
      }
    }

    // Connect to live updates EventSource
    function connectEvents() {
      console.log('Connecting to Live Events Stream...');
      const eventSource = new EventSource('/api/events');

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log('Received Event:', data);

          if (data.type === 'task:log' && data.taskId === selectedTaskId) {
            const consoleDiv = document.getElementById('logsConsole');
            if (consoleDiv) {
              const line = stripAnsi(data.data.message);
              const level = data.data.level;
              const timestamp = new Date(data.timestamp).toLocaleTimeString();
              const prefix = level.toUpperCase().padStart(5);
              const colorMap = {
                'error': '#ff6b6b',
                'warn': '#ffd25c',
                'info': '#4dadf7',
                'debug': '#adb5bd'
              };
              const color = colorMap[level] || 'var(--text-main)';
              const logLine = document.createElement('div');
              logLine.style.color = color;
              logLine.innerText = `[${timestamp}] ${prefix}: ${line}`;
              consoleDiv.appendChild(logLine);
              consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
          }
          
          // Refresh list to capture state changes
          loadTasks();

          // Refresh status locks
          checkServerStatus();

          // Refresh live providers info if health changed
          loadProvidersHealth().then(() => {
            // Re-render welcome panel to reflect provider status if it's currently showing
            if (selectedTaskId === null) {
              renderWelcomePanel();
            }
          });

          // If the event is for the selected task, fetch updates and re-render
          if (data.taskId === selectedTaskId || (selectedTaskId === null && data.type === 'task:started')) {
            if (data.taskId && data.taskId !== 'system' && data.type !== 'task:log') {
              selectTask(data.taskId);
            }
          }
        } catch (err) {
          console.error('Failed to parse event message:', err);
        }
      };

      eventSource.onerror = (err) => {
        console.error('EventSource connection lost. Retrying...', err);
        eventSource.close();
        setTimeout(connectEvents, 3000);
      };
    }

    // Initialize Page
    async function init() {
      // Apply saved theme on startup
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        updateThemeUI(true);
      } else {
        updateThemeUI(false);
      }

      await loadConfig();
      await loadFiles();
      await loadTasks();
      await loadProvidersHealth();
      await checkServerStatus();
      connectEvents();

      // Show welcome panel if no task exists, otherwise select the latest task
      if (tasks.length > 0) {
        selectTask(tasks[0].id);
      } else {
        renderWelcomePanel();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
